build:
  maxIssues: 0

complexity:
  LongMethod:
    # Composable screen functions are declarative and naturally long.
    threshold: 120
    ignoreAnnotated: ['Composable']
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    threshold: 20

style:
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  UnusedPrivateMember:
    active: true
  MaxLineLength:
    maxLineLength: 140
  FunctionOnlyReturningConstant:
    active: false
  UnnecessaryAbstractClass:
    active: false

naming:
  FunctionNaming:
    # Jetpack Compose @Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: false

comments:
  active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
