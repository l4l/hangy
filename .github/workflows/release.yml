name: Release

on:
  push:
    tags:
      - 'v[0-9]+'
      - 'test*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify
        run: ./gradlew testDebugUnitTest detekt spotlessCheck lintDebug

      - name: Decode signing keystore
        env:
          RELEASE_SIGN_KEY: ${{ secrets.RELEASE_SIGN_KEY }}
        run: echo "$RELEASE_SIGN_KEY" | base64 --decode > release.keystore

      - name: Build signed release APK and AAB
        env:
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Remove signing keystore
        if: always()
        run: rm -f release.keystore

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          fail_on_unmatched_files: true
          generate_release_notes: true
